<!doctype html>
<html lang="es" data-bs-theme="dark">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Datos extra</title>
        <link href="https://cdn.jsdelivr.net/npm/fastbootstrap@2.2.0/dist/css/fastbootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="/styles/estilos.css">
        <link rel="icon" type="image/x-icon" href="https://uxwing.com/wp-content/themes/uxwing/download/weather/weather-icon.png">
    </head>
    <body style="padding-top: 70px; user-select: none;">
        <div id="menu"></div>

        <div class="container mt-4 mb-4">
            <h2 class="mb-4 text-white">Datos extra</h2>
            <div class="row g-4 justify-content-center">

                <div class="col-md-4">
                    <div class="card border border-primary rounded-3 shadow-sm bg-secondary bg-opacity-10 text-center h-100">
                        <div class="card-header border-primary">☀️ Índice UV</div>
                        <div class="card-body">
                            <h5 class="card-title display-4">{{uv}}</h5>
                            <p class="card-text text-secondary">{{uv_descripcion}}</p>
                        </div>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card border border-primary rounded-3 shadow-sm bg-secondary bg-opacity-10 text-center h-100">
                        <div class="card-header border-primary">💨 Viento</div>
                        <div class="card-body">
                            <h5 class="card-title display-4">{{viento_velocidad}}</h5>
                            <p class="card-text text-secondary">Dirección: {{viento_direccion}}</p>
                        </div>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card border border-primary rounded-3 shadow-sm bg-secondary bg-opacity-10 text-center h-100">
                        <div class="card-header border-primary">🌡️ Sensación térmica</div>
                        <div class="card-body">
                            <h5 class="card-title display-4">{{sensacion_termica}}</h5>
                            <p class="card-text text-secondary">Temperatura percibida</p>
                        </div>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card border border-primary rounded-3 shadow-sm bg-secondary bg-opacity-10 text-center h-100">
                        <div class="card-header border-primary">👁️ Visibilidad</div>
                        <div class="card-body">
                            <h5 class="card-title display-4">{{visibilidad}}</h5>
                            <p class="card-text text-secondary">Distancia visible</p>
                        </div>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card border border-primary rounded-3 shadow-sm bg-secondary bg-opacity-10 text-center h-100">
                        <div class="card-header border-primary">☁️ Nubosidad</div>
                        <div class="card-body">
                            <h5 class="card-title display-4">{{nubosidad}}</h5>
                            <p class="card-text text-secondary">Cobertura del cielo</p>
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
        <script src="/scripts/script.js" type="module"></script>
    </body>
</html>

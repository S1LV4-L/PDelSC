<!doctype html>
<html lang="es" data-bs-theme="dark">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Mapa</title>
        <link href="https://cdn.jsdelivr.net/npm/fastbootstrap@2.2.0/dist/css/fastbootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="/styles/estilos.css">
        <link rel="icon" type="image/x-icon" href="https://uxwing.com/wp-content/themes/uxwing/download/weather/weather-icon.png">
    </head>
    <body style="padding-top: 70px; user-select: none;">
        <div id="menu"></div>

        <div class="container px-4">
            <h2 class="mb-4 text-white">Mapa climático</h2>
            <div class="card border border-primary rounded-3 shadow-sm p-2">
                <iframe 
                    src="https://embed.windy.com/embed.html?type=map&location=coordinates&metricRain=default&metricTemp=default&metricWind=default&zoom=6&overlay=temp&product=ecmwf&level=surface&lat=-36.633&lon=-57.678&message=true"
                    style="width: 100%; height: calc(100vh - 170px); border: none; border-radius: 0.375rem;">
                </iframe>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
        <script src="/scripts/script.js" type="module"></script>
    </body>
</html>

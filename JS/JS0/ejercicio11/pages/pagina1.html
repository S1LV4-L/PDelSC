<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Ejercicio 11</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
        <link href="../styles/estilos.css" rel="stylesheet"/>
    </head>
    <!-- En celular el flujo es normal. A partir de pantallas medianas (md), la pantalla se congela a 100vh -->
    <body class="py-3 bg-dark text-light min-vh-100 vh-md-100 d-flex flex-column overflow-x-hidden overflow-y-auto overflow-y-md-hidden">
        
        <div class="container d-flex flex-column flex-grow-1 px-3">

            <div class="mb-4">
                <h3 class="text-uppercase fw-semibold mb-0">Ejercicio 11</h3>
                <small class="text-secondary">Método <code>filter()</code></small>
            </div>

            <p class="text-secondary small mb-3 fw-semibold text-uppercase">Acciones</p>
            <div class="row g-3 mb-4 flex-shrink-0">
                <!-- Form 1 -->
                <div class="col-12 col-md-4">
                    <div class="bg-secondary bg-opacity-10 border border-secondary border-opacity-25 rounded-3 shadow-sm p-4 h-100">
                        <form id="form1">
                            <input id="input1" type="number" class="form-control bg-dark text-light border-secondary mb-2"
                            placeholder="Ingresá un número" autocomplete="off">

                            <div class="d-flex gap-2">
                                <button id="sbmt1" type="submit" class="btn btn-outline-light w-100"><span class="d-block fw-semibold my-1">Agregar</span></button>
                                <button id="btn1" type="button" class="btn btn-outline-light w-100"><span class="d-block fw-semibold my-1">Filtrar >10</span></button>
                            </div>
                        </form>
                    </div>
                </div>
                <!-- Form 2 -->
                <div class="col-12 col-md-4">
                    <div class="bg-secondary bg-opacity-10 border border-secondary border-opacity-25 rounded-3 shadow-sm p-4 h-100">
                        <form id="form2">
                            <input id="input2" type="text" class="form-control bg-dark text-light border-secondary mb-2"
                            placeholder="Ingresá una palabra" autocomplete="off">

                            <div class="d-flex gap-2">
                                <button id="sbmt2" type="submit" class="btn btn-outline-light w-100"><span class="d-block fw-semibold my-1">Agregar</span></button>
                                <button id="btn2" type="button" class="btn btn-outline-light w-100"><span class="d-block fw-semibold my-1">Filtrar >5</span></button>
                            </div>
                        </form>
                    </div>
                </div>
                <!-- Form 3 -->
                <div class="col-12 col-md-4">
                    <div class="bg-secondary bg-opacity-10 border border-secondary border-opacity-25 rounded-3 shadow-sm p-4 h-100">
                        <form id="form3">
                            <div class="d-flex gap-2 mb-2">
                                <input id="input3" type="text" class="form-control bg-dark text-light border-secondary w-50"
                                placeholder="Ingresar usuario" autocomplete="off">
                                <select id="estado" class="form-select bg-dark text-light border-secondary w-50" name="estado">
                                    <option value="">Estado...</option>
                                    <option value="activo">Activo</option>
                                    <option value="inactivo">Inactivo</option>
                                </select>
                            </div>

                            <div class="d-flex gap-2">
                                <button id="sbmt3" type="submit" class="btn btn-outline-light w-100"><span class="d-block fw-semibold my-1">Agregar</span></button>
                                <button id="btn3" type="button" class="btn btn-outline-light w-100"><span class="d-block fw-semibold my-1">Filtrar activos</span></button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Registro -->
            <div class="d-flex flex-column flex-grow-1 overflow-hidden mb-2">
                <p class="text-secondary small fw-semibold text-uppercase mb-2">Registro</p>
                <div id="registro" class="d-flex flex-column gap-1 bg-secondary bg-opacity-10 border border-secondary border-opacity-25
                rounded-3 p-3 flex-grow-1 overflow-y-auto"></div>
            </div>

        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script src="../scripts/script.js"></script>
    </body>
</html>

<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Ejercicio 4</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    </head>
    <body class="py-4 px-2 bg-dark text-light min-vh-100" style="user-select: none;">
        <div class="container">

            <div class="mb-4">
                <h3 class="text-uppercase fw-semibold mb-0">Ejercicio 4</h3>
                <small class="text-secondary">Método <code>shift()</code></small>
            </div>

            <div class="bg-secondary bg-opacity-10 border border-secondary border-opacity-25 rounded-3 shadow-sm p-4 mb-4">
                <p class="text-secondary small mb-3 fw-semibold text-uppercase">Acciones</p>
                <div class="row g-2">
                    <div class="col-12 col-md-4">
                        <button id="btn1" class="btn btn-outline-light w-100">
                            <span class="d-block fw-semibold my-2">Quitar el primer número del array</span>
                        </button>
                    </div>
                    <div class="col-12 col-md-4">
                        <button id="btn2" class="btn btn-outline-light w-100">
                            <span class="d-block fw-semibold my-2">Eliminar el primer mensaje del array</span>
                        </button>
                    </div>
                    <div class="col-12 col-md-4">
                        <button id="btn3" class="btn btn-outline-light w-100">
                            <span class="d-block fw-semibold my-2">Agregar un usuario al array</span>
                        </button>
                    </div>
                </div>
            </div>

            <div>
                <p class="text-secondary small fw-semibold text-uppercase mb-2">Resultados</p>
                <div id="registro" class="d-flex flex-column"></div>
            </div>

        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
        <script src="../scripts/script.js" defer></script>
    </body>
</html>

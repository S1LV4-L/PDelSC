<!doctype html>
<html lang="es" data-bs-theme="dark">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Ejercicio 8</title>
        <link href="https://cdn.jsdelivr.net/npm/fastbootstrap@2.2.0/dist/css/fastbootstrap.min.css" rel="stylesheet">
        <link href="../styles/estilos.css" rel="stylesheet"/>
    </head>
    <body class="py-3 min-vh-100 vh-md-100 d-flex flex-column overflow-x-hidden overflow-y-auto overflow-y-md-hidden">

        <div class="container d-flex flex-column flex-grow-1 px-1">

            <div class="mb-4">
                <div class="d-flex justify-content-between">
                    <h3 class="text-uppercase fw-semibold mb-0">Ejercicio 8</h3>
                    <button id="btnTema" class="btn btn-outline-light">
                        <span id="btnTemaIcono" class="me-1">🌙</span>
                        <span id="btnTemaTexto" class="d-none d-sm-inline">Modo claro</span>
                    </button>
                </div>
                <small class="text-secondary">Método <code>includes()</code></small>
            </div>

            <p class="text-secondary small mb-3 fw-semibold text-uppercase">Acciones</p>
            <div class="row g-3 mb-4 flex-shrink-0">
                <!-- Form 1 -->
                <div class="col-12 col-md-4">
                    <div class="card border border-primary rounded-3 shadow-sm bg-secondary bg-opacity-10 h-100">
                        <div class="card-body p-4">
                            <form id="form1">
                                <input id="input1" type="text" class="form-control mb-2"
                                placeholder="Ingresá un usuario" autocomplete="off">

                                <div class="d-flex gap-2">
                                    <button id="sbmt1" type="submit" class="btn btn-outline-primary fw-semibold w-100">Agregar</button>
                                    <button id="btn1" type="button" class="btn btn-outline-primary fw-semibold w-100">Buscar "admin"</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
                <!-- Form 2 -->
                <div class="col-12 col-md-4">
                    <div class="card border border-primary rounded-3 shadow-sm bg-secondary bg-opacity-10 h-100">
                        <div class="card-body p-4">
                            <form id="form2">
                                <input id="input2" type="text" class="form-control mb-2"
                                placeholder="Ingresá un color" autocomplete="off">

                                <div class="d-flex gap-2">
                                    <button id="sbmt2" type="submit" class="btn btn-outline-primary fw-semibold w-100">Agregar</button>
                                    <button id="btn2" type="button" class="btn btn-outline-primary fw-semibold w-100">Buscar "verde"</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
                <!-- Form 3 -->
                <div class="col-12 col-md-4">
                    <div class="card border border-primary rounded-3 shadow-sm bg-secondary bg-opacity-10 h-100">
                        <div class="card-body p-4">
                            <form id="form3">
                                <input id="input3" type="number" class="form-control mb-2"
                                placeholder="Ingresá un número" autocomplete="off">

                                <button id="sbmt3" type="submit" class="btn btn-outline-primary fw-semibold w-100">Agregar</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

            <div class="d-flex flex-column flex-grow-1 overflow-hidden mb-2">
                <p class="text-secondary small fw-semibold text-uppercase mb-2">Registro</p>

                <div id="registro" class="d-flex flex-column gap-1 card border border-primary
                rounded-3 p-3 flex-grow-1 overflow-y-auto bg-secondary bg-opacity-10"></div>
            </div>

        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script src="../scripts/script.js" type="module"></script>
    </body>
</html>

<!doctype html>
<html lang="es" data-bs-theme="dark" class="h-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 2</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/fastbootstrap@2.2.0/dist/css/fastbootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../styles/estilos.css">
</head>

<body class="h-100 d-flex flex-column lg-overflow-hidden pt-9">

    <nav class="navbar fixed-top bg-discovery-subtle px-4 border-bottom border-discovery">
        <div class="container-xxl d-flex justify-content-between align-items-center">
            <a class="navbar-brand fw-bold mb-0 text-body-emphasis">JS5</a>
            <button id="btnTema" class="btn btn-outline-light">
                <span id="btnTemaIcono" class="me-1">🌙</span>
                <span id="btnTemaTexto" class="d-none d-sm-inline">Modo claro</span>
            </button>
        </div>
    </nav>

    <div class="container-xxl p-md-4 flex-grow-1 layout-principal mt-5 mt-lg-2">
        
        <div class="mt-0 row g-3 h-100">

            <!-- Mitad Izquierda (50%) -->
            <div class="col-12 col-lg-6">
                <div class="card border border-discovery rounded-3 shadow-sm w-100 bg-secondary bg-opacity-10 h-100">
                    <div class="card-body p-4 d-flex flex-column">
                        <h5 class="card-title fw-semibold mt-0 mb-3">Gestión de Alumnos</h5>
                        
                        <form id="formulario" class="position-relative flex-grow-1" novalidate>
                            
                            <!-- Input oculto para almacenar el ID cuando se selecciona un alumno -->
                            <input type="hidden" id="idAlumno" name="idAlumno" value="">


                            <div id="modoAgregar">
                                <div class="mb-4 position-relative">
                                    <label for="nombre" class="form-label fw-medium">Nombre</label>
                                    <input type="text" class="form-control form-control-lg" id="nombre" name="nombre" placeholder="Ej: Juan" autocomplete="off">
                                </div>

                                <div class="mb-4 position-relative">
                                    <label for="apellido" class="form-label fw-medium">Apellido</label>
                                    <input type="text" class="form-control form-control-lg" id="apellido" name="apellido" placeholder="Ej: Pérez" autocomplete="off">
                                </div>

                                <div class="mb-7 position-relative">
                                    <label for="edad" class="form-label fw-medium">Edad</label>
                                    <input type="number" class="form-control form-control-lg" id="edad" name="edad" placeholder="Ej: 25" min="0" autocomplete="off">
                                </div>

                                <button type="submit" id="btnIngresar" class="btn btn-outline-success fw-semibold w-100">Ingresar Alumno</button>
                            </div>


                            <div id="modoModificar" class="d-none">
                                <p class="text-muted small mb-3">Los campos vacíos no se modificarán.</p>

                                <div class="row mb-3 align-items-center">
                                    <div class="col-4"><span class="form-label mb-0">Nombre:</span></div>
                                    <div class="col-3">
                                        <input type="text" id="nombreActual" class="form-control form-control-sm bg-transparent text-secondary" disabled>
                                    </div>
                                    <div class="col-1 text-center text-secondary"><i class="bi bi-arrow-right"></i></div>
                                    <div class="col-4">
                                        <input type="text" id="nuevoNombre" name="nuevoNombre" class="form-control form-control-sm" placeholder="Nuevo valor">
                                    </div>
                                </div>

                                <div class="row mb-3 align-items-center">
                                    <div class="col-4"><span class="form-label mb-0">Apellido:</span></div>
                                    <div class="col-3">
                                        <input type="text" id="apellidoActual" class="form-control form-control-sm bg-transparent text-secondary" disabled>
                                    </div>
                                    <div class="col-1 text-center text-secondary"><i class="bi bi-arrow-right"></i></div>
                                    <div class="col-4">
                                        <input type="text" id="nuevoApellido" name="nuevoApellido" class="form-control form-control-sm" placeholder="Nuevo valor">
                                    </div>
                                </div>

                                <div class="row mb-4 align-items-center">
                                    <div class="col-4"><span class="form-label mb-0">Edad:</span></div>
                                    <div class="col-3">
                                        <input type="number" id="edadActual" class="form-control form-control-sm bg-transparent text-secondary" disabled>
                                    </div>
                                    <div class="col-1 text-center text-secondary"><i class="bi bi-arrow-right"></i></div>
                                    <div class="col-4">
                                        <input type="number" id="nuevaEdad" name="nuevaEdad" class="form-control form-control-sm" placeholder="Nuevo valor" min="0">
                                    </div>
                                </div>

                                <button type="submit" id="btnGuardarMod" class="btn btn-outline-warning fw-semibold w-100">Guardar Modificación</button>
                                
                                <button type="button" id="btnVolver" class="btn btn-outline-secondary fw-semibold w-100 mt-3">Volver</button>
                            </div>

                            <div id="mensaje" class="position-absolute start-0 bottom-0 small"></div>
                        </form>
                    </div>        
                </div>
            </div>


            <div class="col-12 col-lg-6 mb-4 mb-lg-0">
                <div class="card border border-discovery rounded-3 shadow-sm w-100 bg-secondary bg-opacity-10">
                    <div id="contenedor-lista-ids" class="card-body p-4 d-flex flex-column row-gap-2">
                        <h5 class="card-title fw-semibold mt-0 mb-0">Alumnos</h5>
                        <div class="overflow-y-auto pe-2 flex-grow-1">  
                            <ul id="usuarios-lista-axios" class="list-group list-group-flush mb-0"></ul>
                        </div>
                    </div>        
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../scripts/script.js" type="module"></script>
</body>
</html>

<!doctype html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../styles/estilos.css">
</head>

<body class="py-4 px-2">

    <div class="container-fluid">

        <!-- Botón tema -->
        <div class="d-flex justify-content-end mb-3">
            <button id="btnTema" class="btn btn-outline-secondary btn-sm">
                🌙 Modo claro
            </button>
        </div>

        <!-- Título -->
        <h3 class="mb-3 text-body-emphasis text-uppercase fw-semibold">
            Ejercicio 1
        </h3>

        <div class="row g-3 mb-4">
            <div class="col-12">
                <div class="bg-secondary bg-opacity-10 border border-secondary border-opacity-25 rounded-3 shadow-sm p-4 h-100">

                    <form id="formulario">

                        <label for="numero" class="form-label">Número</label>

                        <div class="row g-3 align-items-start">
                            <div class="col-12 col-md-9">
                                <input type="number" class="form-control" id="numero" name="numero" placeholder="Ingresá un número">
                            </div>
                            <div class="col-12 col-md-3">
                                <button type="submit" class="btn btn-outline-success fw-semibold w-100">Ingresar</button>
                            </div>
                        </div>

                        <div class="row g-3 align-items-start mt-2">
                            <div class="col-12 col-md-6">
                                <button type="button" class="btn btn-outline-success fw-semibold w-100" id="btnGuardar">Guardar</button>
                            </div>
                            <div class="col-12 col-md-6">
                                <button type="button" class="btn btn-outline-success fw-semibold w-100" id="btnEliminar">Eliminar</button>
                            </div>
                        </div>

                        <div id="errorNumero" class="text-danger small mt-2"></div>
                        <p id="mensaje" class="mt-3"></p>

                    </form>

                </div>
            </div>
        </div>

        <!-- Resultado -->
        <div id="contenedor" class="mt-4"></div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../scripts/script.js" type="module"></script>

</body>
</html>

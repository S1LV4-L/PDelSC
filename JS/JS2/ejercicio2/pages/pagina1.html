<!doctype html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 2</title>
    <link href="https://cdn.jsdelivr.net/npm/fastbootstrap@2.2.0/dist/css/fastbootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../styles/estilos.css">
</head>

<body class="pt-9 pb-2 pb-md-0">

    <nav class="navbar fixed-top bg-discovery-subtle px-4 border-bottom border-discovery">
        <div class="container-xxl d-flex justify-content-between align-items-center">
            <a class="navbar-brand fw-bold mb-0 text-body-emphasis">Ejercicio 2</a>
            <button id="btnTema" class="btn btn-outline-light">
                <span id="btnTemaIcono" class="me-1">🌙</span>
                <span id="btnTemaTexto" class="d-none d-sm-inline">Modo claro</span>
            </button>
        </div>
    </nav>

    <div class="container-xxl px-md-4 d-lg-flex flex-lg-column layout-principal">

        <div class="row g-4 flex-lg-shrink-0 mt-3">
            <div class="col-12 col-lg-5">
                <div class="card border border-discovery rounded-3 shadow-sm h-100 bg-secondary bg-opacity-10">
                    <div class="card-body p-4 position-relative">
                        <h5 class="card-title fw-semibold mt-0 mb-1">Ingresar número</h5>
                        <p class="text-secondary small mb-4">Se pueden registrar hasta <strong>20</strong> números.</p>
                        <form id="formulario">
                            <div class="mb-3 position-relative">
                                <label for="numero" class="form-label fw-medium">Número</label>
                                <input type="number" class="form-control form-control-lg" id="numero" name="numero" placeholder="Ej: 42" autocomplete="off">
                                <div id="errorNumero" class="text-danger small position-absolute start-0 top-100 mt-1"></div>
                            </div>
                            
                            <button type="submit" class="btn btn-success fw-semibold w-100 mt-4">Ingresar</button>
                            <p id="mensaje" class="position-absolute start-0 mt-1 ps-4 small"></p>
                            
                            <hr class="border-light opacity-25 my-8">
                            
                            <div class="d-flex flex-md-row flex-column gap-2">
                                <button type="button" class="btn btn-outline-primary fw-semibold flex-1" id="btnGuardar">Guardar</button>
                                <button type="button" class="btn btn-outline-danger fw-semibold flex-1" id="btnEliminar">Eliminar</button>
                            </div>

                            <div class="d-flex flex-md-row flex-column gap-2 mt-3">
                                <button type="button" class="btn btn-outline-success fw-semibold flex-1" id="btnCargar">Cargar Archivo</button>
                                <button type="button" class="btn btn-outline-success fw-semibold flex-1" id="btnGuardarFiltrados">Guardar Filtrados</button>
                            </div>
                        
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-12 col-lg-7">
                <div class="card border border-discovery rounded-3 shadow-sm h-100 bg-secondary bg-opacity-10">
                    <div class="card-body p-4 d-flex flex-column">
                        <div id="contenedor" class="flex-grow-1"></div>
                        <div id="contenedorFiltrados"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Segundo row: menos margen superior -->
        <div class="row mt-1 flex-lg-grow-1 px-2">
            <div class="col-12 h-100 p-1">
                <div class="card border border-discovery rounded-3 shadow-sm bg-secondary bg-opacity-10">
                    <p class="fs-3 mb-0 px-2">Estadísticas</p>
                    <div class="card-body">
                        <div id="contenedorEstadisticas"></div>
                        <div class="d-flex flex-column flex-md-row justify-content-around p-0 m-0">
                            <p class="fs-5 text-center my-0">Números útiles<br><span id="cantUtiles" class="text-info">-</span></p>
                            <p class="fs-5 text-center my-0">Números no útiles<br><span id="cantNoUtiles" class="text-info">-</span></p>
                            <p class="fs-5 text-center my-0">% de números útiles<br><span id="porcentajeUtiles" class="text-info">-</span></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../scripts/script.js" type="module"></script>
</body>
</html>

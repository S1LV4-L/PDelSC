<!doctype html>
<html lang="es" data-bs-theme="dark" class="h-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 4</title>
    <link href="https://cdn.jsdelivr.net/npm/fastbootstrap@2.2.0/dist/css/fastbootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../styles/estilos.css">
</head>

<body class="h-100 d-flex flex-column pt-9">

    <nav class="navbar fixed-top bg-discovery-subtle px-4 border-bottom border-discovery">
        <div class="container-xxl d-flex justify-content-between align-items-center">
            <a class="navbar-brand fw-bold mb-0 text-body-emphasis">
                <i class="fa-regular fa-calendar-check me-2"></i>Ejercicio 4
            </a>
            <button id="btnTema" class="btn btn-outline-light">
                <span id="btnTemaIcono" class="me-1">🌙</span>
                <span id="btnTemaTexto" class="d-none d-sm-inline">Modo claro</span>
            </button>
        </div>
    </nav>

    <div class="container-xxl p-md-5 flex-grow-1 layout-principal mt-7 mt-lg-4">
        <div class="mt-0 h-100 d-flex flex-column row-gap-4">

            <!-- Cuenta regresiva -->
            <div id="proximo-feriado-hero" class="bg-dark text-white p-4 p-md-5 rounded-4">
                <span class="badge bg-secondary bg-opacity-25 text-white mb-3">
                    <i class="fa-solid fa-bolt me-1"></i>Próximo feriado
                </span>
                <h2 id="hero-nombre" class="fw-bold mb-2">Cargando...</h2>
                <p id="hero-fecha" class="mb-4 opacity-75 fs-5"></p>
                <div id="cuenta-regresiva" class="d-flex gap-3 gap-md-4 flex-wrap"></div>
            </div>

            <!-- Selector de mes -->
            <div class="d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-center gap-3">
                <h5 class="fw-semibold mb-0">Feriados</h5>
                <select id="selector-mes" class="form-select form-select-sm" style="width: auto; min-width: 200px;">
                    <option value="proximos" selected>Próximos feriados</option>
                    <option value="1">Enero</option>
                    <option value="2">Febrero</option>
                    <option value="3">Marzo</option>
                    <option value="4">Abril</option>
                    <option value="5">Mayo</option>
                    <option value="6">Junio</option>
                    <option value="7">Julio</option>
                    <option value="8">Agosto</option>
                    <option value="9">Septiembre</option>
                    <option value="10">Octubre</option>
                    <option value="11">Noviembre</option>
                    <option value="12">Diciembre</option>
                </select>
            </div>

            <!-- Lista -->
            <div id="feriados-lista" class="row g-3"></div>

            <!-- Sin resultados -->
            <div id="sin-resultados" class="d-none text-center py-5">
                <i class="fa-regular fa-face-meh fs-1 text-secondary d-block mb-3"></i>
                <p class="fs-5 text-secondary mb-0">No hay feriados en este mes.</p>
            </div>

            <!-- Footer -->
            <footer class="text-center text-secondary py-3 mt-auto border-top border-secondary-subtle">
                <small>
                    Feriados de Argentina <span id="footer-anio"></span> &middot;
                    Datos informativos &middot; Actualizado en tiempo real
                </small>
            </footer>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../scripts/script.js" type="module"></script>
</body>
</html>

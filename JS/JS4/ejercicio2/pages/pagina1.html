<!doctype html>
<html lang="es" data-bs-theme="dark" class="h-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 2</title>
    <link href="https://cdn.jsdelivr.net/npm/fastbootstrap@2.2.0/dist/css/fastbootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../styles/estilos.css">
</head>

<body class="h-100 d-flex flex-column lg-overflow-hidden pt-9">

    <nav class="navbar fixed-top bg-discovery-subtle px-4 border-bottom border-discovery">
        <div class="container-xxl d-flex justify-content-between align-items-center">
            <a class="navbar-brand fw-bold mb-0 text-body-emphasis">Ejercicio 2</a>
            <button id="btnTema" class="btn btn-outline-light">
                <span id="btnTemaIcono" class="me-1">🌙</span>
                <span id="btnTemaTexto" class="d-none d-sm-inline">Modo claro</span>
            </button>
        </div>
    </nav>

    <div class="container-xxl p-md-4 flex-grow-1 layout-principal mt-7 mt-lg-4">
        <div class="mt-0 d-lg-flex flex-lg-column h-100">

            <div class="col-12 mb-2 mb-lg-3">
                <div class="card border border-discovery rounded-3 shadow-sm w-100 bg-secondary bg-opacity-10">
                    <div class="card-body p-4 d-flex flex-column row-gap-2">
                        <h5 class="card-title fw-semibold mt-0 mb-1">Formulario de registro</h5>
                        <form id="formulario" class="position-relative" novalidate>

                            <div class="mb-5 position-relative">
                                <label for="nombre" class="form-label fw-medium">Nombre</label>
                                <input type="text" class="form-control form-control-lg" id="nombre" name="nombre" placeholder="Ej: Juan Pérez" autocomplete="off">
                                <div id="errorNombre" class="text-danger small position-absolute start-0 top-100 mt-0"></div>
                            </div>

                            <div class="mb-4 position-relative">
                                <label for="email" class="form-label fw-medium">Dirección de correo electrónico</label>
                                <input type="text" class="form-control form-control-lg" id="email" name="email" placeholder="Ej: juanperez@gmail.com" autocomplete="off">
                                <div id="errorEmail" class="text-danger small position-absolute start-0 top-100 mt-0"></div>
                            </div>

                            <div class="mt-6 mb-2">
                                <button type="submit" class="btn btn-outline-success fw-semibold w-100">Ingresar</button>
                                <div id="mensaje" class="position-absolute start-0 mt-0 small"></div>
                            </div>
                            
                        </form>
                    </div>        
                </div>
            </div>

            <div class="col-12 mb-2 mb-lg-0">
                <div class="card border border-discovery rounded-3 shadow-sm w-100 bg-secondary bg-opacity-10">
                    <div id="contenedor-lista-ids" class="card-body p-4 d-flex flex-column row-gap-2">
                        <h5 class="card-title fw-semibold mt-0 mb-0">IDs de respuesta que devuelve la API</h5>
                        <div class="overflow-y-auto pe-2 flex-grow-1">  <!-- div del scroll -->
                            <ul id="usuarios-lista-axios" class="mb-0"></ul>
                        </div>
                    </div>        
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../scripts/script.js" type="module"></script>
</body>
</html>

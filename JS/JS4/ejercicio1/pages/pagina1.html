<!doctype html>
<html lang="es" data-bs-theme="dark" class="h-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1</title>
    <link href="https://cdn.jsdelivr.net/npm/fastbootstrap@2.2.0/dist/css/fastbootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../styles/estilos.css">
</head>

<body class="h-100 d-flex flex-column lg-overflow-hidden pt-9">

    <nav class="navbar fixed-top bg-discovery-subtle px-4 border-bottom border-discovery">
        <div class="container-xxl d-flex justify-content-between align-items-center">
            <a class="navbar-brand fw-bold mb-0 text-body-emphasis">Ejercicio 1</a>
            <button id="btnTema" class="btn btn-outline-light">
                <span id="btnTemaIcono" class="me-1">🌙</span>
                <span id="btnTemaTexto" class="d-none d-sm-inline">Modo claro</span>
            </button>
        </div>
    </nav>

    <div class="container-xxl px-md-4 flex-grow-1 d-lg-flex flex-lg-column layout-principal mt-4">
        <div class="row g-4 mt-0 align-items-start">

            <div class="col-12 col-lg-6">
                <div class="card border border-discovery rounded-3 shadow-sm w-100 bg-secondary bg-opacity-10">
                    <div class="card-body p-4 d-flex flex-column row-gap-2">
                        <h5 class="card-title fw-semibold mt-0 mb-2">Lista de usuarios utilizando Fetch</h5>
                        <div class="overflow-y-auto pe-2 flex-grow-1" style="max-height: 50vh;">
                            <ul id="usuarios-lista-fetch" class="mb-0"></ul>
                        </div>
                    </div>        
                </div>
            </div>

            <div class="col-12 col-lg-6">
                <div class="card border border-discovery rounded-3 shadow-sm w-100 bg-secondary bg-opacity-10">
                    <div class="card-body p-4 d-flex flex-column row-gap-2">
                        <h5 class="card-title fw-semibold mt-0 mb-2">Lista de usuarios utilizando Axios</h5>
                        <div class="overflow-y-auto pe-2 flex-grow-1" style="max-height: 50vh;">
                            <ul id="usuarios-lista-axios" class="mb-0"></ul>
                        </div>
                    </div>        
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../scripts/script.js" type="module"></script>
</body>
</html>

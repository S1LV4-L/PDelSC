<!doctype html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ejercicio 6</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="../styles/estilos.css"/>
</head>

<body class="py-4 px-2">
    <div class="container">

        <div class="d-flex justify-content-end mb-3">
            <button id="btnTema" class="btn btn-outline-secondary btn-sm">
                🌙 Modo claro
            </button>
        </div>

        <h3 class="mb-3 text-uppercase fw-semibold">
            Formulario de deporte
        </h3>

        <form id="formulario">

            <!-- Nombre y Apellido -->
            <div class="row g-3 mb-3">
                <div class="col-12 col-sm-6">
                    <label for="nombre" class="form-label">Nombre</label>
                    <input type="text" class="form-control" id="nombre">
                    <div id="errorNombre" class="error-msg text-danger small mt-1"></div>
                </div>
                <div class="col-12 col-sm-6">
                    <label for="apellido" class="form-label">Apellido</label>
                    <input type="text" class="form-control" id="apellido">
                    <div id="errorApellido" class="error-msg text-danger small mt-1"></div>
                </div>
            </div>

            <!-- Edad y Fecha de nacimiento -->
            <div class="row g-3 mb-3">
                <div class="col-12 col-sm-6">
                    <label for="edad" class="form-label">Edad</label>
                    <input type="number" class="form-control" id="edad" name="edad">
                    <div id="errorEdad" class="error-msg text-danger small mt-1"></div>
                </div>
                <div class="col-12 col-sm-6">
                    <label for="fechaNacimiento" class="form-label">Fecha de nacimiento</label>
                    <input type="date" class="form-control" id="fechaNacimiento" name="fechaNacimiento">
                    <div id="errorFechaNacimiento" class="error-msg text-danger small mt-1"></div>
                </div>
            </div>

            <!-- Sexo -->
            <div class="mb-3">
                <label class="form-label">Sexo</label>
                <div class="d-flex gap-4">
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="genero" value="Masculino">
                        <label class="form-check-label">Masculino</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="genero" value="Femenino">
                        <label class="form-check-label">Femenino</label>
                    </div>
                </div>
                <div id="errorSexo" class="error-msg text-danger small mt-1"></div>
            </div>

            <!-- Documento -->
            <div class="mb-3">
                <label for="documento" class="form-label">Documento</label>
                <input type="number" class="form-control" id="documento" name="documento">
                <div id="errorDocumento" class="error-msg text-danger small mt-1"></div>
            </div>
            
            <!-- Estado civil -->
            <div class="mb-3">
                <label for="estadoCivil" class="form-label">Estado Civil</label>
                <select class="form-select" id="estadoCivil" name="estadoCivil">
                    <option value="">Seleccione su estado civil</option>
                    <option value="Soltero">Soltero/a</option>
                    <option value="Casado">Casado/a</option>
                    <option value="Divorciado">Divorciado/a</option>
                    <option value="Viudo">Viudo/a</option>
                </select>
                <div id="errorNivel" class="error-msg text-danger small mt-1"></div>
            </div>

            <!-- Nacionalidad -->
            <div class="mb-3">
                <label for="nacionalidad" class="form-label">Nacionalidad</label>
                <select class="form-select" id="nacionalidad" name="nacionalidad">
                    <option value="">Seleccione su nacionalidad</option>
                    <option value="Argentina">Argentina</option>
                    <option value="Chile">Chile</option>
                    <option value="Uruguay">Uruguay</option>
                    <option value="Italia">Italia</option>
                    <option value="España">España</option>
                </select>
                <div id="errorNacionalidad" class="error-msg text-danger small mt-1"></div>
            </div>

            <!-- Telefono y EMail -->
            <div class="row g-3 mb-3">
                <div class="col-12 col-sm-6">
                    <label for="telefono" class="form-label">Telefono</label>
                    <input type="number" class="form-control" id="telefono">
                    <div id="errorNombre" class="error-msg text-danger small mt-1"></div>
                </div>
                <div class="col-12 col-sm-6">
                    <label for="Email" class="form-label">E-Mail</label>
                    <input type="email" class="form-control" id="Email">
                    <div id="errorApellido" class="error-msg text-danger small mt-1"></div>
                </div>
            </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-outline-secondary fw-semibold">
                    Registrar
                </button>
            </div>
        </form>

        <div id="contenedor" class="mt-4"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script src="../scripts/script.js" type="module"></script>
</body>
</html>

<!doctype html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ejercicio 2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="../styles/estilos.css"/>
</head>

<body class="py-4 px-2">
    <div class="container">

        <div class="d-flex justify-content-end mb-3">
            <button id="btnTema" class="btn btn-outline-secondary btn-sm">🌙 Modo claro</button>
        </div>

        <h3 class="mb-3 text-body-emphasis text-uppercase fw-semibold">Formulario deportivo</h3>

        <form id="formulario">

            <!-- Nombre -->
            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre del deporte</label>
                <input type="text" class="form-control" id="nombre">
                <div id="errorNombre" class="error-msg text-danger small mt-1"></div>
            </div>

            <!-- Categoría y Ambiente -->
            <div class="mb-3">
                <div class="row">
                    <div class="col-12 col-sm-6">
                        <label class="form-label">Categoría</label>
                        <div class="d-flex gap-4">
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="categoria" value="Individual">
                                <label class="form-check-label">Individual</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="categoria" value="Equipo">
                                <label class="form-check-label">Equipo</label>
                            </div>
                        </div>
                        <div id="errorCategoria" class="error-msg text-danger small mt-1"></div>
                    </div>

                    <div class="col-12 col-sm-6">
                        <label class="form-label">Ambiente</label>
                        <div class="d-flex gap-4">
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="ambiente" value="Indoor">
                                <label class="form-check-label">Indoor</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="ambiente" value="Outdoor">
                                <label class="form-check-label">Outdoor</label>
                            </div>
                        </div>
                        <div id="errorAmbiente" class="error-msg text-danger small mt-1"></div>
                    </div>
                </div>
            </div>

            <!-- Cantidad jugadores -->
            <div class="row g-3 mb-3">
                <div class="col-12 col-sm-6">
                    <label for="cantidadMin" class="form-label">Cantidad mínima de jugadores</label>
                    <input type="number" class="form-control" id="cantidadMin" name="cantidadMin">
                    <div id="errorCantidadMin" class="error-msg text-danger small mt-1"></div>
                </div>
                <div class="col-12 col-sm-6">
                    <label for="cantidadMax" class="form-label">Cantidad máxima de jugadores</label>
                    <input type="number" class="form-control" id="cantidadMax" name="cantidadMax">
                    <div id="errorCantidadMax" class="error-msg text-danger small mt-1"></div>
                </div>
            </div>

            <!-- Nivel -->
            <div class="mb-3">
                <label for="nivel" class="form-label">Nivel</label>
                <select class="form-select" id="nivel" name="nivel">
                    <option value="">Seleccione un nivel</option>
                    <option value="Principiante">Principiante</option>
                    <option value="Intermedio">Intermedio</option>
                    <option value="Avanzado">Avanzado</option>
                </select>
                <div id="errorNivel" class="error-msg text-danger small mt-1"></div>
            </div>

            <!-- Duración -->
            <div class="mb-3">
                <label for="duracion" class="form-label">Duración</label>
                <select class="form-select" id="duracion" name="duracion">
                    <option value="">Seleccione el tiempo de duración</option>
                    <option value="menosDeDiezMin">menos de 10 min</option>
                    <option value="diezTreintaMin">10-30 min</option>
                    <option value="treintaSesentaMin">30-60 min</option>
                    <option value="unaDosHoras">1-2 horas</option>
                    <option value="masDeDosHoras">más de 2 horas</option>
                </select>
                <div id="errorDuracion" class="error-msg text-danger small mt-1"></div>
            </div>

            <!-- Género -->
            <div class="mb-3">
                <label class="form-label">Género permitido</label>
                <div class="d-flex gap-2">
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="genero" value="Masculino">
                        <label class="form-check-label">Masculino</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="genero" value="Femenino">
                        <label class="form-check-label">Femenino</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="genero" value="Mixto">
                        <label class="form-check-label">Mixto</label>
                    </div>
                </div>
                <div id="errorGenero" class="error-msg text-danger small mt-1"></div>
            </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-outline-success fw-semibold">
                    Registrar
                </button>
            </div>
        </form>

        <div id="contenedor" class="mt-4"></div>
    </div>

    <button id="btnScrollTop" class="btn btn-secondary position-fixed bottom-0 end-0 m-3 d-none">Volver arriba</button>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script src="../scripts/script.js" type="module"></script>
</body>
</html>

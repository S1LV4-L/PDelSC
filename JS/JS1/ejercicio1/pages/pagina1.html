<!doctype html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ejercicio 1</title>
    <link href="https://cdn.jsdelivr.net/npm/fastbootstrap@2.2.0/dist/css/fastbootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../styles/estilos.css"/>
</head>

<body class="pt-9 pb-2 pb-md-0">

    <nav class="navbar fixed-top bg-info-subtle px-4 border-bottom border-primary">
        <div class="container-xxl d-flex justify-content-between align-items-center">
            <a class="navbar-brand fw-bold mb-0 text-body-emphasis">Ejercicio 1</a>
            <button id="btnTema" class="btn btn-outline-light">
                <span id="btnTemaIcono" class="me-1">🌙</span>
                <span id="btnTemaTexto" class="d-none d-sm-inline">Modo claro</span>
            </button>
        </div>
    </nav>

    <div class="container-xxl px-md-4">

        <div class="row g-4 mt-3">
            <div class="col-12">
                <div class="card border border-primary rounded-3 shadow-sm bg-secondary bg-opacity-10">
                    <div class="card-body p-4">

                        <h5 class="card-title fw-semibold mt-0 mb-4">Formulario de registro</h5>

                        <form id="formulario">

                            <!-- Nombre y Apellido -->
                            <div class="row g-3 mb-3">
                                <div class="col-12 col-sm-6">
                                    <label for="nombre" class="form-label fw-medium">Nombre</label>
                                    <input type="text" class="form-control" id="nombre">
                                    <div id="errorNombre" class="error-msg text-danger small mt-1"></div>
                                </div>
                                <div class="col-12 col-sm-6">
                                    <label for="apellido" class="form-label fw-medium">Apellido</label>
                                    <input type="text" class="form-control" id="apellido">
                                    <div id="errorApellido" class="error-msg text-danger small mt-1"></div>
                                </div>
                            </div>

                            <!-- Email y Edad -->
                            <div class="row g-3 mb-3">
                                <div class="col-12 col-sm-6">
                                    <label for="email" class="form-label fw-medium">Correo electrónico</label>
                                    <input type="email" class="form-control" id="email">
                                    <div id="errorEmail" class="error-msg text-danger small mt-1"></div>
                                </div>
                                <div class="col-12 col-sm-6">
                                    <label for="edad" class="form-label fw-medium">Edad</label>
                                    <input type="number" class="form-control" id="edad">
                                    <div id="errorEdad" class="error-msg text-danger small mt-1"></div>
                                </div>
                            </div>

                            <!-- País -->
                            <div class="mb-3">
                                <label for="pais" class="form-label fw-medium">País</label>
                                <select class="form-select" id="pais">
                                    <option value="">Seleccione un país</option>
                                    <option value="Argentina">Argentina</option>
                                    <option value="México">México</option>
                                    <option value="España">España</option>
                                    <option value="Colombia">Colombia</option>
                                    <option value="Chile">Chile</option>
                                    <option value="Uruguay">Uruguay</option>
                                </select>
                                <div id="errorPais" class="error-msg text-danger small mt-1"></div>
                            </div>

                            <!-- Género -->
                            <div class="mb-3">
                                <label class="form-label fw-medium">Género</label>
                                <div class="d-flex gap-4">
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="genero" value="Masculino">
                                        <label class="form-check-label">Masculino</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="genero" value="Femenino">
                                        <label class="form-check-label">Femenino</label>
                                    </div>
                                </div>
                                <div id="errorGenero" class="error-msg text-danger small mt-1"></div>
                            </div>

                            <!-- Intereses -->
                            <div class="mb-4">
                                <label class="form-label fw-medium">Intereses</label>
                                <div class="row g-2">
                                    <div class="col-6">
                                        <div class="form-check">
                                            <input class="form-check-input interes" type="checkbox" id="tecnologia">
                                            <label class="form-check-label" for="tecnologia">Tecnología</label>
                                        </div>
                                    </div>
                                    <div class="col-6">
                                        <div class="form-check">
                                            <input class="form-check-input interes" type="checkbox" id="deportes">
                                            <label class="form-check-label" for="deportes">Deportes</label>
                                        </div>
                                    </div>
                                    <div class="col-6">
                                        <div class="form-check">
                                            <input class="form-check-input interes" type="checkbox" id="musica">
                                            <label class="form-check-label" for="musica">Música</label>
                                        </div>
                                    </div>
                                    <div class="col-6">
                                        <div class="form-check">
                                            <input class="form-check-input interes" type="checkbox" id="viajes">
                                            <label class="form-check-label" for="viajes">Viajes</label>
                                        </div>
                                    </div>
                                </div>
                                <div id="errorIntereses" class="error-msg text-danger small mt-2"></div>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-outline-primary fw-semibold">
                                    Registrarse
                                </button>
                            </div>
                        </form>

                    </div>
                </div>
            </div>
        </div>

        <div id="contenedor" class="mt-4"></div>

    </div>

    <button id="btnScrollTop" class="btn btn-secondary position-fixed bottom-0 end-0 mr-4 m-4 d-none">Volver arriba</button>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script src="../scripts/script.js" type="module"></script>
</body>
</html>
